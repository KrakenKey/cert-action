# Temporary: end-to-end check of GitHub OIDC against the dev API. Removed before merge.
name: oidc-e2e-tmp
on:
  push:
    branches: [feat/github-oidc]
permissions:
  id-token: write
  contents: read
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: exchange and use the key
        env:
          INPUT_API_URL: https://api-dev.krakenkey.io
          INPUT_OIDC_AUDIENCE: https://api.krakenkey.io
          INPUT_API_KEY: ''
          INPUT_TRUST_ID: ''
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source ./entrypoint.sh
          resolve_api_key
          profile=$(curl -sS -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer ${INPUT_API_KEY}" "${INPUT_API_URL}/auth/profile")
          echo "profile -> ${profile} user=$(jq -r .username /tmp/p.json)"
          certs=$(curl -sS -o /tmp/c.json -w '%{http_code}' -H "Authorization: Bearer ${INPUT_API_KEY}" "${INPUT_API_URL}/certs/tls")
          echo "certs -> ${certs} $(jq -r .message /tmp/c.json)"
          keys=$(curl -sS -H "Authorization: Bearer ${INPUT_API_KEY}" "${INPUT_API_URL}/auth/api-keys" | jq -r 'map(.name) | join(",")')
          echo "listed keys: ${keys}"
          [[ "${profile}" == 200 && "${certs}" == 403 ]]
